name: Update Flight Delay Risk Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Crucial: Fetches full history so Git can resolve remote changes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd projects/flight-delay-risk-etl
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL and Generate Dashboard
        run: |
          cd projects/flight-delay-risk-etl
          python etl.py
          python visualize.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Flight Risk Dashboard (Automated)
          
          # Target only the exact folder files from root context
          file_pattern: 'projects/flight-delay-risk-etl/flight_history.db projects/flight-delay-risk-etl/latest_risk.png'
          
          # Force a rebase pull if the remote branch moved ahead during execution
          pull_strategy: 'rebase'
