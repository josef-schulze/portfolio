name: Update Flight Delay Risk Dashboard

on:
  schedule:
    - cron: '0 * * * *'     # Once per hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd projects/flight-delay-risk-etl
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: |
          cd projects/flight-delay-risk-etl
          python etl.py

      - name: Generate Visualization
        run: |
          cd projects/flight-delay-risk-etl
          python visualize.py

      - name: Commit and push updated files
        run: |
          cd projects/flight-delay-risk-etl
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes first to avoid conflicts
          git pull --rebase origin main
          
          git add flight_history.db latest_risk.png
          git diff --staged --quiet || git commit -m "Update Flight Risk Dashboard - $(date +'%Y-%m-%d %H:%M UTC')"
          git push