name: Update Flight Delay Risk Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd projects/flight-delay-risk-etl
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL and Generate Dashboard
        run: |
          cd projects/flight-delay-risk-etl
          python etl.py
          python visualize.py

      - name: Commit and Push Changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the specific files
          git add projects/flight-delay-risk-etl/flight_history.db projects/flight-delay-risk-etl/latest_risk.png
          
          # Real check: Only commit if the files actually changed content
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update Flight Risk Dashboard - $(date +'%Y-%m-%d %H:%M UTC')"
            
            # Rebase pull loop to safely upload
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          else
            echo "No data changes detected. Skipping push."
          fi
