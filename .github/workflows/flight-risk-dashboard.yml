name: Update Flight Delay Risk Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch all history so git pull --rebase can map the remote branch
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd projects/flight-delay-risk-etl
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL and Generate Dashboard
        run: |
          cd projects/flight-delay-risk-etl
          python etl.py
          python visualize.py

      - name: Commit and push changes
        run: |
          # 1. Prevent container-based directory permission issues
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # 2. Configure Git from the repository root
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Stage the files using their relative path from the root
          git add projects/flight-delay-risk-etl/flight_history.db projects/flight-delay-risk-etl/latest_risk.png
          
          # 4. Commit and cleanly push using a rebase loop if the remote has changed
          if ! git diff --staged --quiet; then
            git commit -m "Update Flight Risk Dashboard - $(date +'%Y-%m-%d %H:%M UTC')"
            
            # Loop attempts to pull and push up to 3 times if concurrent runs collide
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          else
            echo "No changes to commit"
          fi