name: Update Flight Delay Risk Dashboard

on:
  schedule:
    - cron: '0 * * * *'     # Runs at the top of every hour (once per hour)
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: python etl.py

      - name: Generate Visualization
        run: python visualize.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flight_history.db latest_risk.png
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Update Flight Risk Dashboard - $(date +'%Y-%m-%d %H:%M UTC')"
          git push